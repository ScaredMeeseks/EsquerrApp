# GitHub Pages (Jekyll) — what must NOT be published to the web.
#
# Pages serves the whole branch, so every one of these was reachable at
# https://scaredmeeseks.github.io/EsquerrApp/<path> and returning 200:
#
#   CONTEXT.md            239 KB of internal engineering notes, including
#                         the superadmin address and the deploy procedure
#   firestore.rules       the complete authorization model
#   test/                 the suite documenting how those rules behave
#   deploy.ps1 / .sh      deployment scripts
#   *-preview/-debug.html dev pages, live routes on the site
#
# The rules are enforced server-side so publishing them is not a compromise
# by itself, but there is no reason to hand over the map.
#
# This is the WEB half. The APK half is scripts/build-www.js, which keeps the
# same files out of the Capacitor mirror. Two lists, because they are two
# different distribution channels — but they should be changed together, and
# both fail loudly if the app's own files go missing.
#
# NOTE: there is no .nojekyll in this repo, so the site IS Jekyll-processed
# and `exclude` is honoured. Adding .nojekyll would publish everything again.

exclude:
  # The premium 3D board. NOT a secret in the security sense — it is
  # client-side drawing code and an entitled user can read it out of
  # devtools — but it is the paid feature, and while it sat here anyone
  # could fetch it and drive createBoard3D directly. It now arrives only
  # through the `getBoard3d` callable, which checks the club's
  # entitlement. Keeping it off Pages is what makes that check mean
  # anything. The APK half is the board3d.js pattern in
  # scripts/build-www.js, and the deployable copy is
  # functions/private/board3d.js (kept in step by scripts/sync-board3d.js).
  #
  # ⚠ Verify after deploying: /js/board3d.js must 404.
  - js/board3d.js
  - CONTEXT.md
  - CLAUDE.md
  - HANDOFF.md
  - PROJECT_SUMMARY.md
  - test/
  - functions/
  - scripts/
  - android/
  - www/
  - node_modules/
  - firestore.rules
  - storage.rules
  - firebase.json
  - deploy.ps1
  - deploy.sh
  - package.json
  - package-lock.json
  - capacitor.config.json
  - body-map-debug.html
  - font-preview.html
  - line-color-preview.html
  - new-season-preview.html
  - season-history-preview.html
  # Added 2026-08-28: these three were live at
  # scaredmeeseks.github.io/EsquerrApp/pitch-preview.html and returning 200
  # while every other dev page 404'd — the list is by NAME, so a new preview
  # page is public until someone remembers this file. scripts/build-www.js
  # catches them by pattern (`-preview.html$`) and always did; only Pages
  # needs the names.
  - pitch-preview.html
  - pitch-dark-preview.html
  - pitch-light-preview.html
  # A rendered mockup of the v187 staff training detail page, for design
  # work. Harmless in itself, but it inlines the WHOLE of css/style.css and
  # carries invented player names — there is no reason for it to be a live
  # route. Regenerate with: node scripts/build-training-plan-preview.js . training-plan-preview.html
  - training-plan-preview.html
  # The same, for the v212 match detail redesign. It renders the page twice —
  # staff and player — so a reviewer can see for himself that the starting
  # eleven is absent from the second one. Same reasons to keep it off Pages:
  # the whole stylesheet inlined, and eighteen invented player names.
  # Regenerate with: node scripts/build-partit-preview.js . partit-preview.html
  - partit-preview.html
  # The same, for the v227 Convocatòria redesign. It renders the page four
  # times — staff, menus open, over the 18-man limit, and read-only — so a
  # reviewer can see the states a single screenshot cannot. Same reasons to
  # keep it off Pages: the whole stylesheet inlined, and eighteen invented
  # player names.
  # Regenerate with: node scripts/build-convocatoria-preview.js . convocatoria-preview.html
  - convocatoria-preview.html
  # The same, for the v230 Inici redesign — the two landing pages. It renders
  # five states, and is meant to be looked at at BOTH 1440px and 390px: the
  # media queries key off the viewport, so one screenshot only ever shows one
  # of the two layouts the handoff specifies. Same reasons to keep it off
  # Pages: the whole stylesheet inlined, and twenty-two invented player names.
  # Regenerate with: node scripts/build-inici-preview.js . inici-preview.html
  - inici-preview.html

# Nothing here uses Jekyll's templating — the app is plain static files, and
# `index.html` has no front matter so it is copied verbatim. Keep it that way:
# a stray `{{` in an HTML file would otherwise be parsed as Liquid.
plugins: []
