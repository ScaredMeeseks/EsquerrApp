# GitHub Pages (Jekyll) — what must NOT be published to the web.
#
# Pages serves the whole branch, so every one of these was reachable at
# https://scaredmeeseks.github.io/EsquerrApp/<path> and returning 200:
#
#   CONTEXT.md            239 KB of internal engineering notes, including
#                         the superadmin address and the deploy procedure
#   firestore.rules       the complete authorization model
#   test/                 the suite documenting how those rules behave
#   deploy.ps1 / .sh      deployment scripts
#   *-preview/-debug.html dev pages, live routes on the site
#
# The rules are enforced server-side so publishing them is not a compromise
# by itself, but there is no reason to hand over the map.
#
# This is the WEB half. The APK half is scripts/build-www.js, which keeps the
# same files out of the Capacitor mirror. Two lists, because they are two
# different distribution channels — but they should be changed together, and
# both fail loudly if the app's own files go missing.
#
# NOTE: there is no .nojekyll in this repo, so the site IS Jekyll-processed
# and `exclude` is honoured. Adding .nojekyll would publish everything again.

exclude:
  # The premium 3D board. NOT a secret in the security sense — it is
  # client-side drawing code and an entitled user can read it out of
  # devtools — but it is the paid feature, and while it sat here anyone
  # could fetch it and drive createBoard3D directly. It now arrives only
  # through the `getBoard3d` callable, which checks the club's
  # entitlement. Keeping it off Pages is what makes that check mean
  # anything. The APK half is the board3d.js pattern in
  # scripts/build-www.js, and the deployable copy is
  # functions/private/board3d.js (kept in step by scripts/sync-board3d.js).
  #
  # ⚠ Verify after deploying: /js/board3d.js must 404.
  - js/board3d.js
  - CONTEXT.md
  - CLAUDE.md
  - HANDOFF.md
  - PROJECT_SUMMARY.md
  - test/
  - functions/
  - scripts/
  - android/
  - www/
  - node_modules/
  - firestore.rules
  - storage.rules
  - firebase.json
  - deploy.ps1
  - deploy.sh
  - package.json
  - package-lock.json
  - capacitor.config.json
  - body-map-debug.html
  - font-preview.html
  - line-color-preview.html
  - new-season-preview.html
  - season-history-preview.html
  # Added 2026-08-28: these three were live at
  # scaredmeeseks.github.io/EsquerrApp/pitch-preview.html and returning 200
  # while every other dev page 404'd — the list is by NAME, so a new preview
  # page is public until someone remembers this file. scripts/build-www.js
  # catches them by pattern (`-preview.html$`) and always did; only Pages
  # needs the names.
  - pitch-preview.html
  - pitch-dark-preview.html
  - pitch-light-preview.html
  # A rendered mockup of the v187 staff training detail page, for design
  # work. Harmless in itself, but it inlines the WHOLE of css/style.css and
  # carries invented player names — there is no reason for it to be a live
  # route. Regenerate with: node scripts/build-training-plan-preview.js . training-plan-preview.html
  - training-plan-preview.html
  # The same, for the v212 match detail redesign. It renders the page twice —
  # staff and player — so a reviewer can see for himself that the starting
  # eleven is absent from the second one. Same reasons to keep it off Pages:
  # the whole stylesheet inlined, and eighteen invented player names.
  # Regenerate with: node scripts/build-partit-preview.js . partit-preview.html
  - partit-preview.html
  # The same, for the v227 Convocatòria redesign. It renders the page four
  # times — staff, menus open, over the 18-man limit, and read-only — so a
  # reviewer can see the states a single screenshot cannot. Same reasons to
  # keep it off Pages: the whole stylesheet inlined, and eighteen invented
  # player names.
  # Regenerate with: node scripts/build-convocatoria-preview.js . convocatoria-preview.html
  - convocatoria-preview.html
  # The same, for the v230 Inici redesign — the two landing pages. It renders
  # five states, and is meant to be looked at at BOTH 1440px and 390px: the
  # media queries key off the viewport, so one screenshot only ever shows one
  # of the two layouts the handoff specifies. Same reasons to keep it off
  # Pages: the whole stylesheet inlined, and twenty-two invented player names.
  # Regenerate with: node scripts/build-inici-preview.js . inici-preview.html
  - inici-preview.html
  # And for the v234 Mèdic redesign. This one is the most important of the
  # five to keep OFF Pages: it renders invented but entirely plausible
  # MEDICAL records — named players with diagnoses, severities, physio notes
  # and attached-report filenames. Nothing in it is real, and it must not be
  # published anyway, because a page of that shape at a public URL is worth
  # nobody's second glance to work out.
  # ⚠ THIS LIST IS BY NAME. `scripts/build-www.js` excludes previews by the
  # `-preview.html` pattern, but that only covers the APK mirror — Pages
  # reads this file and nothing else, which is how a preview shipped live
  # once. A new preview needs a line here or it is public.
  # Regenerate with: node scripts/build-medical-preview.js . medical-preview.html
  - medical-preview.html
  # And for the v243 player training page. Unlike the others in this list the
  # WHOLE page is the app — renderTrainingDetail() is sliced out and called,
  # not approximated — which is what makes it worth keeping: the assertions in
  # test/training-detail.test.js read a string, and a string cannot show that
  # the forecast overflowed the hero at 390px. Look at it at BOTH 1440px and
  # 390px; the media queries key off the viewport. Off Pages for the usual two
  # reasons: the whole stylesheet inlined, and fourteen invented player names.
  # Regenerate with: node scripts/build-player-training-preview.js . player-training-preview.html
  - player-training-preview.html
  # And for the v244 Les meves estadístiques redesign. Like the one above, the
  # WHOLE page is the app — renderPlayerStats() is sliced out and called — and
  # it renders twice, with and without enough load data, because the no-data
  # frame is the one nobody thinks to look at. Look at it at BOTH 1440px and
  # 390px. Off Pages for the usual reasons and one more: it draws a body map
  # of invented injuries against a named player, which is the shape of a
  # medical record even when every value in it is made up.
  # Regenerate with: node scripts/build-ms-preview.js . ms-preview.html
  - ms-preview.html
  # And the two halves of the v245 handoff. Accions renders the page with work
  # to do and with everything answered; Notificacions renders the feed, the
  # unread-only view and the all-read one. Both freeze the clock, because the
  # RPE edit window and the relative timestamps would otherwise make every
  # regeneration a different file. Off Pages for the usual two reasons — the
  # whole stylesheet inlined, and invented player names — and, for the feed, a
  # third: it lists a named player's self-reported injury, which is the shape
  # of a medical record even when the record is made up.
  # Regenerate with: node scripts/build-accions-preview.js . accions-preview.html
  #                  node scripts/build-notificacions-preview.js . notificacions-preview.html
  - accions-preview.html
  - notificacions-preview.html
  # And for the v254 Configuració redesign. This one is off Pages for a
  # reason the others are not: it is the CLUB ADMIN screen, and it renders a
  # club's join-code column, its lead's address and its staff mailing lists.
  # Invented, but that is the shape of a credential and a contact list.
  # ⚠ It is also the only preview that needs a DOM — the page is a form, so
  # the builder mounts it in jsdom rather than concatenating a string. See the
  # header of the script.
  # Regenerate with: node scripts/build-configuracio-preview.js . configuracio-preview.html
  - configuracio-preview.html
  # And for the v255 Gestió d'usuaris redesign. Off Pages for the sharpest
  # reason on this list: it is a MEMBER DIRECTORY — thirteen names against
  # thirteen email addresses, plus who holds which role in the club. Invented,
  # but that is exactly the shape of a contact list, and a page of it at a
  # public URL is worth nobody's second glance to work out.
  # Regenerate with: node scripts/build-gestio-usuaris-preview.js . gestio-usuaris-preview.html
  - gestio-usuaris-preview.html

  # And for the v257 Pissarres redesign — the superadmin catalogue. Off Pages
  # because it names other clubs and the coaches who drew each board, which is
  # the one page in the app whose whole point is showing several clubs' work
  # side by side. Invented, and still not a thing to leave at a public URL.
  # ⚠ The second preview that needs a DOM: renderAdminBoards() returns a shell
  # and _abRender() writes the page after an async read.
  # Regenerate with: node scripts/build-pissarres-preview.js . pissarres-preview.html
  - pissarres-preview.html

# Nothing here uses Jekyll's templating — the app is plain static files, and
# `index.html` has no front matter so it is copied verbatim. Keep it that way:
# a stray `{{` in an HTML file would otherwise be parsed as Liquid.
plugins: []
