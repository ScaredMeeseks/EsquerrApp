name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Guard - frontend changes must bump sw.js CACHE_NAME
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD)
            if echo "$CHANGED" | grep -qE '^(js/|css/|index\.html)' && ! echo "$CHANGED" | grep -q '^sw\.js'; then
              echo "::error::js/, css/ or index.html changed without bumping CACHE_NAME in sw.js — offline clients would keep stale code"
              exit 1
            fi
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install npm dependencies
        # ci, not install: the lockfile is the record of what a build used,
        # and `npm install` silently rewrites it. A lock that disagrees with
        # package.json now fails here instead of producing a differently
        # resolved APK. (A stale lock is what broke every Cloud Function on
        # 2026-08-08 — same trap, different directory.)
        run: npm ci

      - name: Build the web mirror (www/)
        # ONE definition of what ships inside the APK, shared with
        # `npm run build:www`. There used to be two — this rsync and a
        # PowerShell one-liner — excluding different sets, so a local build
        # and a CI build put different files in the app. The script
        # self-checks and exits non-zero if a dev file leaked or an app file
        # is missing.
        run: npm run build:www

      - name: Sync Capacitor (copy assets + install native plugins)
        run: npx cap sync android

      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Accept Android SDK licenses & install SDK 36
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses && $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace --info

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: EsquerrApp-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── Play release track ──────────────────────────────────────────
      # Runs only once an upload keystore exists in secrets, so this can sit
      # here before there is a Play account without failing a single build.
      # To turn it on, add: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
      #
      # Play needs an AAB, not an APK, and rejects debuggable builds — which
      # is why the debug artifact above can never be uploaded to it.
      - name: Decode upload keystore
        id: keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/upload.jks
          echo "path=$RUNNER_TEMP/upload.jks" >> "$GITHUB_OUTPUT"

      - name: Build signed AAB
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload AAB artifact
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v5
        with:
          name: EsquerrApp-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90
